name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Render の build phase と揃えるため、CI も Node 20 / pnpm 9.15 / Prisma 5.x で動かす。
# Prisma 7 系は Node 22+ を要求するため避ける。

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # next-auth v5 は build 時に AUTH_SECRET を読むことがあるため dummy を渡す。
      # 本物の値は Render dashboard で sync: false で設定される。
      AUTH_SECRET: ci-only-do-not-use-in-prod
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @me-me-en/infrastructure exec prisma generate --schema=prisma/schema.prisma

      - name: ESLint (boundary rules)
        run: pnpm lint

      - name: TypeScript (all workspaces)
        run: pnpm -r typecheck

      - name: Vitest (all workspaces)
        run: pnpm -r test

      - name: Next.js build
        run: pnpm -F @me-me-en/web build

  integration:
    name: integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meimeitei
          POSTGRES_PASSWORD: meimeitei
          POSTGRES_DB: meimeitei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meimeitei -d meimeitei"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://meimeitei:meimeitei@localhost:5432/meimeitei?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @me-me-en/infrastructure exec prisma generate --schema=prisma/schema.prisma

      - name: Integration tests (Prisma adapters)
        run: pnpm --filter @me-me-en/infrastructure test:integration

  e2e:
    name: e2e smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meimeitei
          POSTGRES_PASSWORD: meimeitei
          POSTGRES_DB: meimeitei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meimeitei -d meimeitei"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://meimeitei:meimeitei@localhost:5432/meimeitei?schema=public
      DATA_STORE: prisma
      AUTH_SECRET: e2e-smoke-secret-do-not-use-in-prod
      AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate + migrate deploy
        run: |
          pnpm --filter @me-me-en/infrastructure exec prisma generate --schema=prisma/schema.prisma
          pnpm --filter @me-me-en/infrastructure exec prisma migrate deploy --schema=prisma/schema.prisma

      - name: Install Playwright browsers (chromium)
        run: pnpm --filter @me-me-en/web exec playwright install --with-deps chromium

      - name: Build Next.js
        run: pnpm --filter @me-me-en/web build

      - name: Start server in background
        run: |
          pnpm --filter @me-me-en/web start &
          # ヘルスチェックで起動完了を待つ。60s で諦め。
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start within 60s"
          exit 1

      - name: Playwright tests
        run: pnpm --filter @me-me-en/web e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
